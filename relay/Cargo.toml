[package]
name = "re-with"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rela-proto.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
futures-util.workspace = true
md-5 = "0.11"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }

[dev-dependencies]
tokio-tungstenite.workspace = true # the version axum 0.8 uses: one tungstenite in the build, not two

[lints]
workspace = true
