# One workspace for the relay and the Rust core (see docs/development.md).
[workspace]
resolver = "3"
members = ["crates/proto", "crates/core", "crates/mpv", "crates/rela_desktop", "crates/android", "crates/android/bindgen", "relay", "tools/genre-tree"]

[workspace.package]
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
rela-proto = { path = "crates/proto" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.29.0"

# The release binary as the CMake build made it: symbols stripped (the app's CPU and RAM are Qt's, QML's and mpv's)
[profile.release]
strip = true

# Debug builds: line numbers for our crates (backtraces still point at the line), none for dependencies. Full
# debug info made target/ tens of GB and every link slower.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
