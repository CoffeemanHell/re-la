[package]
name = "rela-android"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

# The Android app's librela.so and its Kotlin bindings (android/build-rust.sh).
[lib]
crate-type = ["cdylib", "lib"]
name = "rela"

[dependencies]
rela-core = { path = "../core" }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
uniffi = "0.32"

# Android's own certificate verifier; its Kotlin half comes in android/app/build.gradle.kts
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[lints]
workspace = true
