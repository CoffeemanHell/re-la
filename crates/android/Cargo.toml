[package]
name = "rela-android"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

# The Android app's librela.so and its Kotlin bindings (android/build-rust.sh).
[lib]
crate-type = ["cdylib", "lib"]
name = "rela"

[dependencies]
rela-core = { path = "../core" }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
uniffi = "0.32"

[lints]
workspace = true
