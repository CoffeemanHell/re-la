[package]
name = "uniffi-bindgen"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

# The Kotlin bindings' generator on its own: it reads the phone's librela.so, so the core isn't built again for the host.
[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }

[lints]
workspace = true
