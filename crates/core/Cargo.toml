[package]
name = "rela-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rela-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2"
percent-encoding = "2"
fastrand = "2"
unicode-script = "0.5"
md-5 = "0.11"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"] }
futures-util.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros", "fs", "io-util"] }
# rustls: no OpenSSL on Android. Certificates are the system's to judge (a homelab CA works, as it did with Qt): reqwest
# does so by itself, the websocket is given the same verifier.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.7"

[dev-dependencies]
re-with = { path = "../../relay" }
axum = "0.8.9"
md-5 = "0.11"
sha2 = "0.11"
tokio = { workspace = true, features = ["rt-multi-thread"] }
rcgen = "0.14"
futures-util.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[lints]
workspace = true
