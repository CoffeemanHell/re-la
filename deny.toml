# cargo deny check: the Rust dependencies' known holes, licenses and sources (.github/workflows/security.yml).

[advisories]
yanked = "deny"
unmaintained = "workspace" # only the crates we chose ourselves

[licenses]
# all fine inside an AGPL-3.0 program
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
